<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja da Demi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="caixa">

        <h1 class="titulo">Venda de Pão Correio</h1>
        <p class="descricao">Preços a partir de 1 Wolf e 80!</p>

        <h2>Produtos</h2>

        <ul class="UL">
            
            <li class="caixaTeruel1">
                <img src="IMG/Boneco_feio_pa_porra.webp" alt="Boneco Teruel">
                <h5>Boneco Teruel</h5> 
                <span class="valor">1 Wolf e 80</span>
            </li>

            <li class="caixaTeruel2">
                <img src="IMG/Boneco_feio_pra_porra_2.jpg" alt="Boneco Teruel 120 faces">
                <h5>Boneco Teruel 120 faces</h5> 
                <span class="valor">1 Wolf e 80</span>
            </li>
            
            <li class="caixaTeruel2">
                <img src="IMG/boneco_bob_minions_679_1_20200703103139.webp" alt="Boneco Teruel 120 faces">
                <h5>Boneco BOB Teruel amarelo</h5> 
                <span class="valor">1 Wolf e 80</span>
            </li>

        </ul>

        <button class="botao" onclick="abrirModal()">Comprar Agora</button>

        <a href="https://discord.gg/AvUP4W77dP" target="_blank">
            <button class="botaoDC">Discord</button>
        </a>

        <!-- Texto p posicionado dentro da caixa container -->
        <p class="curto"> Dimenos.inc sites </p>

        <div id="modalPix" class="modal-overlay">
            <div class="modal-conteudo">
                
                <span class="botao-fechar" onclick="fecharModal()">&times;</span>

                <h2>Pague a compra</h2>
                <p>Escaneie o QR Code abaixo para pagar via PIX:</p>

                <img src="IMG/pix.jpg" alt="QR Code PIX" class="qr-code">
            </div>
        </div>

    </div>

    <script>
        // Função chamada ao clicar em 'Comprar Agora' -> Exibe a janela
        function abrirModal() {
            document.getElementById("modalPix").style.display = "flex";
        }

        // Função chamada ao clicar no 'X' -> Esconde a janela
        function fecharModal() {
            document.getElementById("modalPix").style.display = "none";
        }
    </script>

</body>

</html>
